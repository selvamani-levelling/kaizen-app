<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="KAIZEN — Continuous Improvement">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<title>KAIZEN</title>
<style>
:root{--ink:#0b1220;--muted:#64748b;--line:#e2e8f0;--green:#22c55e;--blue:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f8fb;color:var(--ink)}
body{overflow:hidden}
#shell{position:fixed;inset:0;background:#f6f8fb}
.top{height:74px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:1px solid rgba(226,232,240,.8);z-index:4}
.brand{display:flex;align-items:center;gap:11px}.mark{width:44px;height:44px;border-radius:13px;background:var(--ink);display:grid;place-items:center;color:white;font-weight:950;font-size:21px;box-shadow:0 8px 20px rgba(11,18,32,.18)}.brand b{font-size:18px;letter-spacing:.8px}.brand span{display:block;font-size:9px;color:#64748b;letter-spacing:1.4px;margin-top:2px;font-weight:800}
.pill{font-size:10px;font-weight:900;letter-spacing:.7px;padding:8px 10px;border-radius:999px;background:#ecfdf5;color:#15803d}
.frame{position:absolute;top:74px;bottom:0;left:0;right:0;background:#f6f8fb}
iframe{width:100%;height:100%;border:0;display:block;background:#f6f8fb}
.splash{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 70% 20%,#1e3a8a 0,#111827 34%,#070b14 100%);color:#fff;transition:opacity .5s ease,visibility .5s}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-inner{text-align:center;padding:30px}.bigmark{width:88px;height:88px;margin:0 auto 22px;border-radius:26px;background:#fff;color:#0b1220;display:grid;place-items:center;font-size:42px;font-weight:950;box-shadow:0 20px 55px rgba(0,0,0,.35)}.splash h1{margin:0;font-size:36px;letter-spacing:3px}.splash p{margin:9px 0 24px;color:#cbd5e1;font-size:13px;letter-spacing:1.5px}.loader{width:120px;height:4px;background:rgba(255,255,255,.16);border-radius:99px;margin:auto;overflow:hidden}.loader i{display:block;height:100%;width:45%;background:#22c55e;border-radius:99px;animation:load 1.2s infinite ease-in-out}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
@media(min-width:800px){.top{padding-left:32px;padding-right:32px}.frame{padding:12px 18px 18px}.frame iframe{border-radius:22px;box-shadow:0 12px 35px rgba(15,23,42,.08)}}
</style>
</head>
<body>
<div id="shell">
  <header class="top">
    <div class="brand"><div class="mark">K</div><div><b>KAIZEN</b><span>CONTINUOUS IMPROVEMENT</span></div></div>
    <div class="pill">● LIVE</div>
  </header>
  <main class="frame">
    <iframe src="https://script.google.com/macros/s/AKfycbxGIKp2QDW9Fx3HDFfQwnffVowrTI50zGPlOgxG9gd-9Is4Lp3u391AbM-5fuLbFR1E/exec" title="KAIZEN"></iframe>
  </main>
  <div class="splash" id="splash">
    <div class="splash-inner">
      <div class="bigmark">K</div>
      <h1>KAIZEN</h1>
      <p>SMALL CHANGES • BIG IMPACT</p>
      <div class="loader"><i></i></div>
    </div>
  </div>
</div>
<script>
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
setTimeout(()=>document.getElementById("splash").classList.add("hide"),1200);
</script>
</body>
</html>
